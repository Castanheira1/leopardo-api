# CI/CD do VAP.
#
# 1. "testes": roda em todo push/PR — sintaxe do backend, testes de contrato
#    (sem banco) e a suíte de integração completa contra um Postgres efêmero
#    com o schema.sql aplicado (mesmo fluxo de scripts/test-com-pg-local.sh).
# 2. "android": em push na main, manual, e em PR que mexa em android/, ios/,
#    capacitor.config.ts ou package*.json — valida o shell Capacitor de ponta a
#    ponta gerando o APK de debug e o AAB de release (sem assinatura). Sem a
#    cobertura em PR, mudanças no código nativo chegavam à main sem nunca terem
#    sido compiladas. O artefato fica disponível na aba Actions por 14 dias. A
#    assinatura para a Play Store continua local (keystore), ver
#    docs/PUBLICAR-LOJAS.md.
# 3. "ios": mesmas condições do "android", em runner macOS (gratuito em repo
#    público) — compila o Swift para simulador, sem assinatura. É o que evita
#    descobrir erro de compilação só depois de alugar um Mac.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  testes:
    name: Testes (contrato + integração com Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vap
          POSTGRES_PASSWORD: vap
          POSTGRES_DB: vap_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://vap:vap@localhost:5432/vap_test
      JWT_SECRET: test-secret-com-mais-de-32-caracteres-aqui-ok
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Sintaxe do backend
        run: |
          node --check server.js
          for f in src/*.js src/rotas/*.js src/services/*.js; do node --check "$f"; done

      - name: Testes de contrato e unitários (sem banco)
        run: |
          node tests/map-markers.test.js
          node tests/sessao-mapa.test.js
          node tests/ui-sheet.test.js
          node tests/viagem-pulso-pax.test.js
          node tests/encadeamento-perna.test.js
          node tests/viagem-finalizar-status.test.js
          node tests/rota-pista.test.js

      - name: Aplicar schema.sql no Postgres de teste
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f schema.sql

      - name: Suíte de integração (rotas HTTP reais)
        run: node tests/integration.test.js

  # Em PR, o build Android só roda quando o shell nativo muda — compilar o Gradle
  # em todo PR de backend custaria minutos à toa.
  # Cada plataforma é avaliada em separado: mexer só no Android não deve disparar o
  # build iOS. Isso importa mais em repositório privado, onde runner macOS consome
  # 10x da cota de minutos do Actions.
  nativo:
    name: Detecta mudanças no shell nativo
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      android: ${{ steps.check.outputs.android }}
      ios: ${{ steps.check.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          arquivos=$(git diff --name-only "$BASE...$HEAD")
          # Mudanças comuns às duas plataformas: config do Capacitor e dependências.
          comum='^(capacitor\.config\.ts|package(-lock)?\.json)'

          if grep -qE "^android/|$comum" <<<"$arquivos"; then
            echo "android=true" >> "$GITHUB_OUTPUT"
            echo "Shell Android alterado — build será executado."
          else
            echo "android=false" >> "$GITHUB_OUTPUT"
            echo "Sem mudanças no Android — build dispensado."
          fi

          if grep -qE "^ios/|$comum" <<<"$arquivos"; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
            echo "Shell iOS alterado — build será executado."
          else
            echo "ios=false" >> "$GITHUB_OUTPUT"
            echo "Sem mudanças no iOS — build dispensado."
          fi

  android:
    name: Build Android (Capacitor)
    needs: [testes, nativo]
    # push/manual: sempre. PR: só se o shell Android mudou (job "nativo" acima,
    # que é pulado fora de PR — daí o !cancelled() em vez de depender do sucesso
    # de todos os needs).
    if: >-
      ${{ !cancelled() && needs.testes.result == 'success'
          && (github.event_name != 'pull_request' || needs.nativo.outputs.android == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Instalar dependências
        run: npm ci

      - name: Capacitor sync (bundle local + plugins; sem server.url)
        run: npx cap sync android

      # Assinatura opcional: se os secrets existirem, grava o .jks e assina o AAB.
      # Secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      #          ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD (opcional = store password)
      - name: Preparar keystore (se secrets presentes)
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$HOME/vap-release.jks"
            echo "path=$HOME/vap-release.jks" >> "$GITHUB_OUTPUT"
            echo "has_signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_signing=false" >> "$GITHUB_OUTPUT"
            echo "Sem secrets de keystore — AAB unsigned (ok para validar build)."
          fi

      - name: Gerar APK de debug e AAB de release
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          # Alias padrão se o secret não estiver definido
          export ANDROID_KEY_ALIAS="${ANDROID_KEY_ALIAS:-vap}"
          export ANDROID_KEY_PASSWORD="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
          ./gradlew assembleDebug bundleRelease --no-daemon

      - name: Publicar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: vap-android
          retention-days: 14
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab

  # Compila o app iOS num runner macOS.
  #
  # Existe porque o código Swift (TripTrackingPlugin, MainViewController) não é
  # compilado em nenhum outro lugar: sem isto, um erro de Swift só apareceria ao
  # abrir o Xcode — que, sem Mac próprio, significa alugar um por hora.
  #
  # CUSTO: gratuito e ilimitado enquanto o repositório for público. Ao torná-lo
  # privado, runner macOS passa a consumir 10x da cota de minutos do Actions
  # (~6 min de build = ~60 min de cota; o plano Free dá 2.000/mês). Por isso o
  # job só roda quando ios/, capacitor.config.ts ou package*.json mudam — mexer
  # no Android ou no backend não dispara build de iOS.
  #
  # Build para simulador de propósito: dispensa certificado e provisioning
  # profile, e ainda assim compila todo o Swift e valida o Info.plist. Assinar e
  # enviar para a App Store é outro passo (docs/PUBLICAR-LOJAS.md).
  ios:
    name: Build iOS (Capacitor)
    needs: [testes, nativo]
    if: >-
      ${{ !cancelled() && needs.testes.result == 'success'
          && (github.event_name != 'pull_request' || needs.nativo.outputs.ios == 'true') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Capacitor sync (copia webDir e resolve plugins)
        run: npx cap sync ios

      - name: Compilar (simulador, sem assinatura)
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            build
